{{/* A Selected Work project's papers as short links with venues. Pass the list of papers. */}}
<ul class="project__papers">
  {{ range . }}
  {{ $url := .url }}{{ if not $url }}{{ $url = (index (index (where hugo.Data.publications "id" .pub) 0).links 0).url }}{{ end }}
  <li><a href="{{ $url }}">{{ .label }}</a> <span class="v">{{ .venue }}</span></li>
  {{ end }}
</ul>
