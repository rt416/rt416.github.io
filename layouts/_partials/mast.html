<header class="mast">
  <a class="mast__name" href="/"{{ if .IsHome }} aria-current="page"{{ end }}>{{ hugo.Data.site.name }}</a>
  <nav aria-label="Primary">
    <ul>
      {{- $here := .RelPermalink }}
      {{- range slice (dict "t" "Research" "u" "/research/") (dict "t" "Talks" "u" "/talks/") }}
      <li><a href="{{ .u }}"{{ if eq $here .u }} aria-current="page"{{ end }}>{{ .t }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
