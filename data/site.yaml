# Home page introduction. 'intro' is the opening paragraph before launch (at launch, data/launch.yaml 'mission' replaces it);
# 'past' paragraphs follow in both states.
intro: "Hi, I’m Ryu. I’ve spent the last 10 years building AI systems for healthcare and biomedical applications. I’m most passionate about creating AI that empowers human experts and transforms their work in ways that are lasting, scalable and joyful."
past:
  - "At Google DeepMind, where I was a Staff Research Scientist until recently, I worked on foundational research and real-world deployment of LLM-based systems for healthcare. Most recently, I led research on [AI co-clinician](https://x.com/GoogleDeepMind/status/2049867061279457761), Google DeepMind’s new initiative to reimagine how care is delivered."
  - "Prior to that, I co-led multimodality for [Med-Gemini](https://arxiv.org/pdf/2404.18416) and was a co-technical lead of [AMIE](https://www.nature.com/articles/s41591-026-04371-0), Google’s research programme on conversational diagnostic AI, helping the team take it from the first text-only diagnostic study to multimodal understanding, specialist care, disease management and a prospective study in primary care. Before that, I led [Flamingo-CXR](https://www.nature.com/articles/s41591-024-03302-1), the first demonstration of human–AI collaboration in radiology report writing."
  - "Previously, I was a Senior Researcher in the Health Intelligence group at [Microsoft Research Cambridge](https://www.microsoft.com/en-us/research/lab/microsoft-research-cambridge/) with [Aditya Nori](https://www.microsoft.com/en-us/research/people/adityan/), where I worked on [InnerEye](https://www.bbc.co.uk/news/health-65988768), deployed across the NHS for radiotherapy, and T-Detect, the first T-cell based COVID test. I did my PhD in Computer Vision and Machine Learning at UCL, supervised by [Daniel C. Alexander](http://www0.cs.ucl.ac.uk/staff/d.alexander/) and [Antonio Criminisi](https://www.microsoft.com/en-us/research/people/acriminisi/) (Microsoft Research)."
  - "Along the way, I’ve been fortunate to work with medical AI start-ups around the world. I was one of the first members of ThinkSono, where I co-developed the prototype of a real-time deep learning system for detecting deep vein thrombosis in ultrasound videos, and a research intern at Butterfly Network, where an algorithm I worked on shipped in their handheld ultrasound device. I’ve also advised SyntheticGestalt and a Terumo spin-out, and currently advise Aillis."
