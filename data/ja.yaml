name: "丹野 龍太郎"
description: "丹野龍太郎。医療・生命科学のためのAIシステムをつくっています。元 Google DeepMind Staff Research Scientist。"
intro: "こんにちは、丹野龍太郎です。この10年間、医療・生命科学の分野でAIシステムをつくってきました。いちばん情熱を注いでいるのは、専門家の力を引き出し、その仕事を長く続き、広く届き、そして楽しいものへと変えていくAIです。"
past:
  - "Google DeepMind では最近まで Staff Research Scientist として、医療向けLLMシステムの基礎研究から実社会での展開までに取り組んできました。直近では、医療の届け方そのものを捉え直す Google DeepMind の新しい取り組み、[AI co-clinician](https://x.com/GoogleDeepMind/status/2049867061279457761) の研究をリードしました。"
  - "それ以前は、[Med-Gemini](https://arxiv.org/pdf/2404.18416) でマルチモーダル領域を共同でリードし、Google の対話型診断AIの研究プログラム [AMIE](https://www.nature.com/articles/s41591-026-04371-0) では共同テクニカルリードを務めました。AMIE では、テキストのみで行った最初の診断研究から、マルチモーダルな診察、専門医療、疾患管理、そしてプライマリケアでの前向き研究へと、チームとともに研究を広げてきました。さらに遡ると、放射線科のレポート作成で人とAIの協働を初めて示した [Flamingo-CXR](https://www.nature.com/articles/s41591-024-03302-1) を主導しました。"
  - "その前は [Microsoft Research Cambridge](https://www.microsoft.com/en-us/research/lab/microsoft-research-cambridge/) の Health Intelligence グループで、Senior Researcher として [Aditya Nori](https://www.microsoft.com/en-us/research/people/adityan/) らと働きました。英国の NHS 全体で放射線治療に導入された [InnerEye](https://www.bbc.co.uk/news/health-65988768) や、T細胞を用いた初の COVID 検査 T-Detect に携わりました。博士課程は UCL で、[Daniel C. Alexander](http://www0.cs.ucl.ac.uk/staff/d.alexander/) 先生と [Antonio Criminisi](https://www.microsoft.com/en-us/research/people/acriminisi/) 先生（Microsoft Research）の指導のもと、コンピュータビジョンと機械学習を研究しました。"
  - "また、世界各地の医療AIスタートアップと関わる機会にも恵まれてきました。ThinkSono には初期メンバーの一人として加わり、超音波動画から深部静脈血栓症をリアルタイムで検出する深層学習システムのプロトタイプを共同開発しました。Butterfly Network ではリサーチインターンとして働き、開発に携わったアルゴリズムが同社の携帯型超音波デバイスに搭載されました。このほか SyntheticGestalt やテルモ発のスピンアウト企業のアドバイザーを務め、現在は Aillis のアドバイザーをしています。"
