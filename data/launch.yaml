# For organisers (not shown on the site).
short_bio: "Ryutaro Tanno is Chief AI Officer at Pathos, which is reimagining how drugs are developed with AI, starting with cancer and now expanding into neurology. Before Pathos he spent four years as a Staff Research Scientist at Google DeepMind, where he led research on the AI co-clinician, was a co-technical lead of the AMIE research programme on conversational diagnostic AI and co-led multimodality for Med-Gemini. Before that he was a Senior Researcher at Microsoft Research Cambridge. He holds a PhD in Computer Vision and Machine Learning from UCL."
