# For organisers (not shown on the site).
short_bio: "Ryutaro Tanno is Chief AI Officer at Pathos, which is reimagining how drugs are developed with AI, starting with cancer and now expanding into neurology. Before Pathos he spent four years as a Staff Research Scientist at Google DeepMind, where he led research on the AI co-clinician, was a co-technical lead of the AMIE research programme on conversational diagnostic AI and co-led multimodality for Med-Gemini. Before that he was a Senior Researcher at Microsoft Research Cambridge. He holds a PhD in Computer Vision and Machine Learning from UCL."

# Work with me page (/work-with-me/): linked from "I'm hiring!" on the home page and from every footer.
work_with_me:
  title: "Work with me"
  footer_link: "I’m hiring: join my team at Pathos"
  intro:
    - "I recently joined [Pathos](https://www.linkedin.com/company/pathos-ai/) as Chief AI Officer. At Pathos, AI shapes every big decision we make: which drugs to develop, which patients to treat and how to run the trials."
    - "We don’t build models and agents in isolation. We own our drug assets and run our own clinical trials, which puts us in a rare position to close the loop: data from hospitals and our wet lab flows back into the AI system and informs the next drug decisions. I’m here to build an AI drug engine that keeps learning over time."
    - "After 20+ years in London, I have moved to New York, where I’m expanding my team with new Members of Technical Staff to accelerate our AI work. We want people who care as much about the drugs as about the models, and who want their work tested against real lab and clinical data. Focus areas include, but aren’t limited to, mid- and post-training, data and evaluation, and memory and continual learning."
  # Closing line: FORM is replaced by careers_url.
  careers_url: "https://ats.rippling.com/en-US/pathos/jobs/9e3f9d30-9b33-412a-9ebd-97e69539489a"
  apply: "If you’re interested, [apply here](FORM) or message me on [LinkedIn](https://www.linkedin.com/in/ryutaro-tanno-180455306/)."
  apply_without_form: "If you’re interested, message me on [LinkedIn](https://www.linkedin.com/in/ryutaro-tanno-180455306/)."
