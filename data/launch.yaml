# Launch copy: everything the site says about the current role. Read when launch = true in hugo.toml (see README).

# Social card subtitle ("<title> · <locations>") and structured data.
title: "Chief AI Officer, Pathos"
locations: "New York"
job_title: "Chief AI Officer"
org: "Pathos"

# Home page: these paragraphs replace the "Hi, I'm Ryu…" intro; past_first replaces the Google DeepMind paragraph.
opening:
  - "Hi, I’m Ryu. I recently joined [Pathos](https://www.linkedin.com/company/pathos-ai/) as Chief AI Officer, to help make their ambition of re-engineering drug development with AI a reality. Over the last 10 years, I’ve built AI systems for healthcare and biomedical applications, and I’m most passionate about creating AI that empowers human experts and transforms their work in ways that are lasting, scalable and joyful."
past_first: "Before Pathos, I spent four years at Google DeepMind as a Staff Research Scientist, working on foundational research and real-world deployment of LLM-based systems for healthcare. Most recently, I led research on [AI co-clinician](https://x.com/GoogleDeepMind/status/2049867061279457761), Google DeepMind’s new initiative to reimagine how care is delivered."

# Japanese home page (/ja/).
opening_ja:
  - "こんにちは、丹野龍太郎です。AI で医薬品開発をつくり直すという [Pathos](https://www.linkedin.com/company/pathos-ai/) の大きな目標を実現するため、最近 Chief AI Officer として加わりました。この10年間、医療・生命科学の分野でAIシステムの開発に携わってきました。私がいまいちばん情熱を注いでいるのは、AI技術を駆使して専門家の力をさらに引き出し、その仕事を、持続可能で、より多くの人に届く、やり甲斐のある新しい形へと変えていくことです。"
past_first_ja: "Pathos に加わる前は、Google DeepMind で4年間 Staff Research Scientist として、医療向けLLMシステムの基礎研究から実社会での展開までに取り組みました。直近では、医療の届け方そのものを捉え直す Google DeepMind の新しい取り組み、[AI co-clinician](https://x.com/GoogleDeepMind/status/2049867061279457761) の研究をリードしました。"

# Search and social descriptions.
description: "Ryutaro Tanno is Chief AI Officer at Pathos, reimagining how drugs are developed with AI, starting with cancer and now expanding into neurology."
description_ja: "丹野龍太郎。Pathos の Chief AI Officer として、AI で医薬品開発のあり方を見つめ直しています。がんから始まり、現在は神経疾患にも取り組んでいます。"

# Fallback one-liners, used only if the opening paragraphs above are removed.
