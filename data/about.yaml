# About page: first-person bio paragraphs and a third-person short bio for organisers.
bio:
  - "Most recently I was a Staff Research Scientist at Google DeepMind (2022–2026). I co-led the AMIE research programme on conversational diagnostic AI, led research on the AI co-clinician in the Science Unit, co-led multimodality for Med-Gemini, led Flamingo-CXR, a study of clinician–AI collaboration on radiology report generation, and contributed to the AI co-scientist."
  - "Before that I was a Senior Researcher at Microsoft Research Cambridge (2019–2022). I worked on Project InnerEye, deployed across the NHS for radiotherapy, and on T-Detect, the first T-cell based COVID test. I led a small team that built a robustness toolkit used by more than 50 colleagues, and supervised postdocs, interns and AI residents."
  - "My PhD at UCL was on reasoning with uncertainty in deep learning for safer medical image computing: models that quantify their own uncertainty and learn from noisy or disagreeing labels. Our work on uncertainty in MRI super-resolution received the MICCAI 2017 Best Paper Award."
  - "Alongside research I have worked with start-ups: as a founding engineer at ThinkSono, as a research intern at Butterfly Network, where an algorithm I worked on shipped in the product, and as an advisor to Aillis (current), Terumo and SyntheticGestalt."
short_bio: "Ryutaro Tanno builds AI for medicine and science. Most recently he was a Staff Research Scientist at Google DeepMind, where he co-led the AMIE research programme on conversational diagnostic AI and led research on the AI co-clinician. Before that he was a Senior Researcher at Microsoft Research Cambridge. He holds a PhD in Computer Vision and Machine Learning from UCL."
